<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بەڕێوەبەر - چێشتخانەی ئایس پۆپ</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
        body { background:#f0f2f5; min-height:100vh; padding:12px; display:flex; justify-content:center; align-items:flex-start; }
        #app { width:100%; max-width:1400px; min-height:100vh; }

        /* ═══════════════════════════════════════════════════════
           LOGIN — ULTRA MODERN DESIGN
           ═══════════════════════════════════════════════════════ */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background: #0a0a1a;
        }

        /* Animated gradient background */
        .login-page::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(
                from 0deg,
                #0a0a1a 0deg,
                #1a1040 60deg,
                #2d1b69 120deg,
                #1a1040 180deg,
                #0a0a1a 240deg,
                #0f0f2e 300deg,
                #0a0a1a 360deg
            );
            animation: rotateBg 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBg {
            to { transform: rotate(360deg); }
        }

        /* Floating orbs */
        .login-page::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(108,92,231,0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,206,201,0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(225,112,85,0.15) 0%, transparent 50%);
            animation: pulseGlow 8s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* Grid pattern overlay */
        .login-grid-overlay {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(108,92,231,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108,92,231,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        /* Card */
        .login-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(18, 18, 40, 0.65);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 32px;
            padding: 48px 36px 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 0 0 1px rgba(108, 92, 231, 0.2),
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 120px rgba(108, 92, 231, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9) rotateX(10deg);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0);
                filter: blur(0);
            }
        }

        /* Glowing border animation */
        .login-box::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                #6c5ce7 90deg,
                #00cec9 180deg,
                #e17055 270deg,
                transparent 360deg
            );
            z-index: -1;
            animation: borderRotate 6s linear infinite;
            opacity: 0.6;
        }

        @keyframes borderRotate {
            to { transform: rotate(360deg); }
        }

        /* Icon badge */
        .login-icon-badge {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 24px;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 50%, #00cec9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow:
                0 10px 40px rgba(108, 92, 231, 0.5),
                0 0 60px rgba(108, 92, 231, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
            animation: iconFloat 3s ease-in-out infinite;
            position: relative;
        }

        .login-icon-badge::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 28px;
            background: inherit;
            z-index: -1;
            filter: blur(15px);
            opacity: 0.6;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        /* Title */
        .login-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #a29bfe 50%, #00cec9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 32px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Divider */
        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 24px;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(108, 92, 231, 0.4), transparent);
        }

        .login-divider span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Input wrapper */
        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .input-wrapper .input-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .input-wrapper .input-icon svg {
            width: 100%;
            height: 100%;
            stroke: #a29bfe;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .input-wrapper input {
            width: 100%;
            padding: 17px 52px 17px 20px;
            border-radius: 16px;
            border: 2px solid rgba(108, 92, 231, 0.25);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: right;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
        }

        .input-wrapper input:focus {
            border-color: #6c5ce7;
            background: rgba(108, 92, 231, 0.12);
            box-shadow:
                0 0 0 4px rgba(108, 92, 231, 0.15),
                0 0 30px rgba(108, 92, 231, 0.3);
            transform: translateY(-2px);
        }

        .input-wrapper input:focus + .input-icon,
        .input-wrapper input:focus ~ .input-icon {
            opacity: 1;
        }

        .input-wrapper input:focus ~ .input-icon svg {
            stroke: #a29bfe;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 17px 30px;
            margin-top: 12px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 50%, #6c5ce7 100%);
            background-size: 200% 200%;
            box-shadow:
                0 10px 30px rgba(108, 92, 231, 0.5),
                0 0 60px rgba(108, 92, 231, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.5px;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.7s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 15px 45px rgba(108, 92, 231, 0.7),
                0 0 80px rgba(108, 92, 231, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Footer */
        .login-footer {
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .login-footer .dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: #00cec9;
            border-radius: 50%;
            margin: 0 6px;
            vertical-align: middle;
            box-shadow: 0 0 10px #00cec9;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-box {
                padding: 36px 24px 32px;
                border-radius: 26px;
                max-width: 100%;
            }
            .login-icon-badge {
                width: 68px;
                height: 68px;
                font-size: 32px;
                border-radius: 20px;
            }
            .login-title { font-size: 22px; }
            .login-subtitle { font-size: 11px; margin-bottom: 24px; }
            .input-wrapper input { padding: 15px 46px 15px 16px; font-size: 14px; }
            .input-wrapper .input-icon { width: 18px; height: 18px; right: 15px; }
            .login-btn { padding: 15px 24px; font-size: 15px; }
        }

        /* ═══════════════════════════════════════════════════════
           REST OF APP (unchanged)
           ═══════════════════════════════════════════════════════ */
        .btn { background:#6c5ce7; color:#fff; border:none; padding:14px 30px; border-radius:12px; font-size:18px; font-weight:600; cursor:pointer; transition:.3s; width:100%; margin:6px 0; }
        .btn:hover { background:#5a4bd1; transform:translateY(-2px); box-shadow:0 8px 25px rgba(108,92,231,.3); }
        .btn-sm { padding:6px 12px; font-size:13px; width:auto; margin:2px; display:inline-block; }
        .btn-success { background:#00b894; } .btn-success:hover { background:#00a381; }
        .btn-danger { background:#ff6b6b; } .btn-danger:hover { background:#e55a5a; }
        .btn-warning { background:#fdcb6e; color:#1a1a2e; } .btn-warning:hover { background:#f0b84d; }
        .btn-primary { background:#6c5ce7; } .btn-primary:hover { background:#5a4bd1; }

        .dashboard { background:#fff; border-radius:20px; padding:16px; box-shadow:0 8px 30px rgba(0,0,0,.05); }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
        .stat-card { background:#f8fafc; border-radius:14px; padding:12px; text-align:center; border:2px solid #e2e8f0; transition:.3s; }
        .stat-card:hover { border-color:#6c5ce7; }
        .stat-card .number { font-size:22px; font-weight:700; color:#6c5ce7; }
        .stat-card .label { font-size:12px; color:#64748b; margin-top:3px; }
        .manager-menu { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
        .manager-menu button { padding:8px 14px; border:2px solid #e2e8f0; border-radius:10px; background:#f8fafc; font-weight:600; cursor:pointer; font-size:13px; flex:1; min-width:80px; transition:.3s; }
        .manager-menu button.active { background:#6c5ce7; color:#fff; border-color:#6c5ce7; }
        .manager-menu button:hover { border-color:#6c5ce7; }

        .hidden { display:none !important; }
        .flex { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .text-center { text-align:center; }
        .header-bar { display:flex; justify-content:space-between; align-items:center; padding:8px 0; flex-wrap:wrap; gap:6px; }
        .header-bar .title { font-size:18px; font-weight:700; color:#1a1a2e; }
        .header-bar .user-info { color:#64748b; font-weight:500; font-size:13px; }
        .back-btn { background:none; border:none; color:#6c5ce7; font-size:14px; font-weight:600; cursor:pointer; padding:4px 12px; border-radius:8px; }
        .back-btn:hover { background:#f8f7ff; }
        .logo-text { font-size:28px; font-weight:800; color:#1a1a2e; margin-bottom:6px; }
        .logo-text span { color:#6c5ce7; }
        .subtitle { color:#64748b; font-size:13px; margin-bottom:12px; }

        table { width:100%; border-collapse:collapse; font-size:13px; }
        table th, table td { padding:8px 6px; text-align:right; border-bottom:1px solid #e2e8f0; }
        table th { background:#f8fafc; font-weight:700; font-size:12px; }
        table tr:hover td { background:#f8fafc; }

        .form-group { margin-bottom:10px; }
        .form-group label { font-weight:600; display:block; margin-bottom:3px; color:#1a1a2e; font-size:14px; }
        select, input[type="text"], input[type="number"] { padding:8px 12px; border:2px solid #e2e8f0; border-radius:10px; font-size:14px; width:100%; background:#f8fafc; }
        select:focus, input:focus { border-color:#6c5ce7; outline:none; }

        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(4px); padding:16px; }
        .modal { background:#fff; border-radius:20px; padding:24px; max-width:500px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,.2); }
        .modal h3 { font-size:22px; margin-bottom:12px; color:#1a1a2e; }
        .modal .close-btn { float:left; background:none; border:none; font-size:26px; cursor:pointer; color:#64748b; }
        .modal .close-btn:hover { color:#1a1a2e; }

        .branch-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; margin-right:3px; }
        .branch-tag.zanco { background:#3498db; color:#fff; }
        .item-branch-info { font-size:10px; color:#64748b; margin-top:2px; }

        .order-item { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#fff; border-radius:8px; margin-bottom:4px; box-shadow:0 2px 8px rgba(0,0,0,.04); border-right:4px solid #6c5ce7; flex-wrap:wrap; gap:4px; font-size:14px; }
        .order-type-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; }
        .order-type-badge.dine { background:#3498db; color:#fff; }
        .order-type-badge.takeaway { background:#f39c12; color:#fff; }

        .partner-detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-top:12px; }
        .partner-detail-card { background:#f8fafc; border-radius:16px; padding:16px; border:2px solid #e2e8f0; transition:.3s; cursor:pointer; }
        .partner-detail-card:hover { border-color:#6c5ce7; box-shadow:0 8px 30px rgba(108,92,231,.1); transform:translateY(-2px); }
        .partner-detail-card.expanded { grid-column:1/-1; }
        .partner-detail-card.expanded .partner-detail-orders { max-height:400px; }
        .partner-detail-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; border-bottom:2px solid #e2e8f0; padding-bottom:10px; }
        .partner-detail-logo { width:40px; height:40px; border-radius:10px; object-fit:contain; background:#fff; padding:3px; border:1px solid #e2e8f0; }
        .partner-detail-name { font-size:18px; font-weight:700; color:#1a1a2e; }
        .partner-detail-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
        .partner-stat { background:#fff; border-radius:10px; padding:10px; text-align:center; }
        .partner-stat-number { display:block; font-size:18px; font-weight:700; color:#6c5ce7; }
        .partner-stat-label { font-size:11px; color:#64748b; }
        .partner-detail-orders { background:#fff; border-radius:10px; padding:8px; max-height:150px; overflow-y:auto; transition:max-height .3s; }
        .partner-order-item { display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:6px 8px; border-bottom:1px solid #f1f1f1; font-size:12px; }
        .partner-order-item:last-child { border-bottom:none; }
        .partner-order-id { font-weight:700; color:#6c5ce7; min-width:40px; font-size:12px; }
        .partner-order-items { flex:1; color:#1a1a2e; font-size:11px; }
        .partner-order-code { background:#e17055; color:#fff; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; }
        .partner-order-total { font-weight:700; color:#1a1a2e; min-width:60px; text-align:left; font-size:12px; }
        .partner-order-time { color:#94a3b8; font-size:10px; min-width:40px; }
        .no-orders { color:#94a3b8; text-align:center; padding:16px; font-size:13px; }
        .partner-detail-footer { margin-top:10px; padding-top:10px; border-top:2px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; }
        .partner-shift { font-size:12px; color:#64748b; font-weight:500; }

        .live-indicator { display:inline-block; width:8px; height:8px; background:#00b894; border-radius:50%; animation:pulse 1.5s infinite; margin-right:6px; }
        @keyframes pulse { 0%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(.8);} 100%{opacity:1;transform:scale(1);} }

        .toast { position:fixed; bottom:20px; right:20px; left:20px; background:#00b894; color:#fff; padding:12px 20px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.15); font-weight:600; z-index:999; animation:slideUp .4s ease; max-width:400px; margin:0 auto; text-align:center; }
        .toast.error { background:#ff6b6b; }
        @keyframes slideUp { from{transform:translateY(80px);opacity:0;} to{transform:translateY(0);opacity:1;} }

        .loading-overlay { position:fixed; inset:0; background:rgba(255,255,255,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; gap:12px; color:#6c5ce7; font-size:18px; font-weight:600; }
        .loading-overlay .spinner { width:40px; height:40px; border:4px solid #e2e8f0; border-top-color:#6c5ce7; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg);} }

        .error-container { padding:30px; text-align:center; background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.1); }
        .error-container h2 { color:#ff6b6b; margin-bottom:12px; }

        .monthly-trend-page { background:#fff; border-radius:20px; padding:16px; box-shadow:0 8px 30px rgba(0,0,0,.05); }
        .monthly-trend-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; padding-bottom:12px; border-bottom:3px solid #6c5ce7; }
        .monthly-trend-header h3 { font-size:20px; font-weight:700; color:#1a1a2e; margin:0; }
        .monthly-trend-summary { display:flex; gap:10px; flex-wrap:wrap; }
        .monthly-trend-summary .summary-box { background:linear-gradient(135deg,#6c5ce7,#5a4bd1); color:#fff; padding:8px 16px; border-radius:12px; text-align:center; min-width:100px; }
        .monthly-trend-summary .summary-box .val { font-size:16px; font-weight:700; display:block; }
        .monthly-trend-summary .summary-box .lbl { font-size:10px; opacity:.85; display:block; margin-top:2px; }
        .monthly-trend-summary .summary-box.alt { background:linear-gradient(135deg,#00b894,#00a381); }
        .monthly-trend-summary .summary-box.alt2 { background:linear-gradient(135deg,#e17055,#d63031); }
        .month-info-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; background:linear-gradient(135deg,#f8f7ff,#f0f0ff); border:2px solid #e2e8f0; border-radius:14px; padding:10px 16px; margin-bottom:14px; }
        .month-info-bar .month-name { font-size:16px; font-weight:700; color:#6c5ce7; }
        .month-info-bar .month-dates { font-size:13px; color:#64748b; font-weight:600; }
        .month-info-bar .month-days-count { background:#6c5ce7; color:#fff; padding:4px 14px; border-radius:20px; font-size:12px; font-weight:700; }
        .day-cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
        .day-card { background:#f8fafc; border-radius:14px; padding:12px; border:2px solid #e2e8f0; transition:all .3s; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:6px; min-height:130px; }
        .day-card:hover { border-color:#6c5ce7; transform:translateY(-3px); box-shadow:0 8px 25px rgba(108,92,231,.15); }
        .day-card.today { border-color:#6c5ce7; background:linear-gradient(135deg,#f0f0ff,#f8f7ff); box-shadow:0 6px 20px rgba(108,92,231,.15); }
        .day-card.has-data { background:linear-gradient(135deg,#f0fdf6,#f8fffc); border-color:#00b894; }

        const COLLECTION_NAME = 'sis';

        const GROUP_OPTIONS = ['پیتزا','بەرگر','سپاگێتی','فینگەر','لەفە','مریشک','ماسی','خواردنەوەکان'];

        // ============ BUSINESS DAY UTILS ============
        function getBusinessDayStart(timestamp) {
            const d = new Date(timestamp);
            if (d.getHours() < 2 || (d.getHours() === 2 && d.getMinutes() < 30)) {
                const p = new Date(d); p.setDate(p.getDate() - 1);
                return new Date(p.getFullYear(), p.getMonth(), p.getDate(), 0, 0, 0, 0);
            }
            return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
        }
        function isSameBusinessDay(a, b) {
            return getBusinessDayStart(a).getTime() === getBusinessDayStart(b).getTime();
        }
        function getCurrentBusinessDayStart() { return getBusinessDayStart(new Date()); }

        function getDaysInMonth(date) { return new Date(date.getFullYear(), date.getMonth()+1, 0).getDate(); }
        function getMonthStart(date) { return new Date(date.getFullYear(), date.getMonth(), 1, 0,0,0,0); }
        function getMonthEnd(date) { return new Date(date.getFullYear(), date.getMonth(), getDaysInMonth(date), 23,59,59,999); }
        function getMonthDays(ref = new Date()) {
            const days = []; const total = getDaysInMonth(ref);
            for (let i = 1; i <= total; i++) days.push(new Date(ref.getFullYear(), ref.getMonth(), i));
            return days;
        }
        function getMonthNameKurdish(date) {
            return ['کانونی دووەم','شوبات','ئازار','نیسان','ئایار','حوزەیران','تەمموز','ئاب','ئەیلوول','تشرینی یەکەم','تشرینی دووەم','کانونی یەکەم'][new Date(date).getMonth()];
        }
        function formatDateKurdish(date) {
            const d = new Date(date);
            return `${d.getDate()} ${getMonthNameKurdish(d)} ${d.getFullYear()}`;
        }
        function getDayName(date) {
            return ['یەکشەممە','دووشەممە','سێشەممە','چوارشەممە','پێنجشەممە','هەینی','شەممە'][date.getDay()];
        }

        function formatPrice(p) {
            if (!p && p !== 0) return '0 د.ع';
            return Math.round(p).toLocaleString('en-US') + ' د.ع';
        }
        function now() {
            return new Date().toLocaleString('ku', { hour:'2-digit', minute:'2-digit', hour12:true });
        }
        function toast(msg, isErr = false) {
            const t = document.createElement('div');
            t.className = 'toast' + (isErr ? ' error' : '');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2,4); }

        // ============ STATE ============
        const state = {
            currentPage: 'login',
            currentRole: null,
            currentUser: null,
            managerTab: 'dashboard',
            items: [],
            orders: [],
            partnerOrders: [],
            partnerImages: { talabat:'', zuu:'', wade:'', leezu:'' },
            isLoading: true,
            firebaseError: null,
            unsubscribeItems: null,
            unsubscribeOrders: null,
            unsubscribePartnerOrders: null,
            showItemModal: false,
            editingItemId: null,
            selectedBranch: 'زانکۆ',
            dailyResetTimestamp: null,
            monthlyResetTimestamp: null
        };

        // ============ RESETS ============
        async function performMonthlyReset() {
            const nowD = new Date();
            const bd = getCurrentBusinessDayStart();
            if (state.monthlyResetTimestamp) {
                const lr = new Date(state.monthlyResetTimestamp);
                const lb = getBusinessDayStart(lr);
                if (lb.getMonth() === bd.getMonth() && lb.getFullYear() === bd.getFullYear()) return;
            }
            state.monthlyResetTimestamp = nowD.toISOString();
            try {
                await updateDoc(docRef, { orders: [], monthlyResetTimestamp: state.monthlyResetTimestamp, lastUpdated: new Date().toISOString() });
            } catch(e) { console.error(e); }
            state.orders = [];
        }

        async function checkAndApplyResets() {
            const bd = getCurrentBusinessDayStart();
            if (state.monthlyResetTimestamp) {
                const lb = getBusinessDayStart(new Date(state.monthlyResetTimestamp));
                if (lb.getMonth() !== bd.getMonth() || lb.getFullYear() !== bd.getFullYear()) {
                    await performMonthlyReset();
                }
            }
        }

        async function loadResetTimestamps() {
            try {
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.monthlyResetTimestamp) state.monthlyResetTimestamp = data.monthlyResetTimestamp;
                    await checkAndApplyResets();
                }
            } catch(e) { console.error(e); }
        }

        // ============ FIRESTORE ============
        function loadItemsFromFirestore() {
            if (state.unsubscribeItems) state.unsubscribeItems();
            try {
                state.unsubscribeItems = onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        state.items = (data.items || []).map(item => ({
                            id: item.id || genId(),
                            name: item.naw || 'بێ ناو',
                            price: item.nrx || 0,
                            group: item.grwp || 'گشتی',
                            image: item.link || '',
                            branch: item.branch || 'زانکۆ',
                            partnerPrices: {
                                talabat: item.nt ?? null,
                                zuu: item.nz ?? null,
                                wade: item.nw ?? null,
                                leezu: item.nl ?? null
                            }
                        }));
                        if (data.partnerImages) state.partnerImages = data.partnerImages;
                        if (data.monthlyResetTimestamp) state.monthlyResetTimestamp = data.monthlyResetTimestamp;
                        state.isLoading = false;
                        render();
                    } else {
                        createDefaultDocument();
                    }
                }, (err) => {
                    state.firebaseError = err.message;
                    state.isLoading = false;
                    render();
                });
            } catch(e) { console.error(e); state.isLoading = false; render(); }
        }

        async function createDefaultDocument() {
            try {
                const defaults = [
                    { id:'p1', naw:'پیتزا مەرگ', nrx:12000, grwp:'پیتزا', link:'', branch:'زانکۆ', nt:14000, nz:13000, nw:12500, nl:13500 },
                    { id:'p2', naw:'پیتزا مەک', nrx:10000, grwp:'پیتزا', link:'', branch:'زانکۆ', nt:12000, nz:11000, nw:10500, nl:11500 },
                    { id:'g1', naw:'شاورما گەس', nrx:8000, grwp:'مریشک', link:'', branch:'زانکۆ', nt:10000, nz:9000, nw:8500, nl:9500 },
                    { id:'d1', naw:'پەپسی', nrx:2000, grwp:'خواردنەوەکان', link:'', branch:'زانکۆ', nt:3000, nz:2500, nw:2000, nl:2500 }
                ];
                await setDoc(docRef, {
                    items: defaults,
                    partnerImages: { talabat:'', zuu:'', wade:'', leezu:'' },
                    orders: [],
                    lastUpdated: new Date().toISOString(),
                    monthlyResetTimestamp: new Date().toISOString()
                });
                loadItemsFromFirestore();
            } catch(e) { console.error(e); }
        }

        async function saveItemsToFirestore() {
            try {
                const itemsData = state.items.map(item => ({
                    id: item.id, naw: item.name, nrx: item.price, grwp: item.group,
                    link: item.image || '', branch: item.branch || 'زانکۆ',
                    nt: item.partnerPrices?.talabat ?? null,
                    nz: item.partnerPrices?.zuu ?? null,
                    nw: item.partnerPrices?.wade ?? null,
                    nl: item.partnerPrices?.leezu ?? null
                }));
                await updateDoc(docRef, { items: itemsData, lastUpdated: new Date().toISOString() });
                toast('✅ سەیڤ کرا');
            } catch(e) { toast('هەڵە لە سەیڤکردن', true); }
        }

        function loadOrdersFromFirestore() {
            if (state.unsubscribeOrders) state.unsubscribeOrders();
            state.unsubscribeOrders = onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    state.orders = data.orders || [];
                    if (data.monthlyResetTimestamp) state.monthlyResetTimestamp = data.monthlyResetTimestamp;
                    checkAndApplyResets();
                    render();
                }
            });
        }

        function loadPartnerOrdersFromFirestore() {
            if (state.unsubscribePartnerOrders) state.unsubscribePartnerOrders();
            state.unsubscribePartnerOrders = onSnapshot(collection(db, PARTNER_ORDERS_COLLECTION), (snap) => {
                const arr = [];
                snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                state.partnerOrders = arr;
                render();
            });
        }

        // ============ RENDER ============
        function render() {
            const app = document.getElementById('app');

            if (state.isLoading) {
                app.innerHTML = `<div class="loading-overlay"><div class="spinner"></div><div>⏳ چاوەڕێ بکە...</div></div>`;

        function renderManager() {
            return renderManagerFull();
        }

        function renderManagerFull() {
            let filteredItems = state.items.filter(i => i.branch === state.selectedBranch);
            const itemsHtml = filteredItems.map(item => `
                <tr>
                    <td>${item.image ? `<img src="${item.image}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;" onerror="this.style.display='none';"/>` : '🍽️'} ${item.name} <span class="branch-tag zanco">${item.branch}</span></td>
                    <td>${formatPrice(item.price)}</td>
                    <td>${item.partnerPrices ? Object.entries(item.partnerPrices).filter(([k,v])=>v!=null).map(([k,v])=>`${k}: ${formatPrice(v)}`).join('<br/>') : '-'}</td>
                    <td>${item.group || 'گشتی'}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" data-action="edit-item" data-id="${item.id}">✏️</button>
                        <button class="btn btn-sm btn-danger" data-action="delete-item" data-id="${item.id}">🗑️</button>
                    </td>
                </tr>`).join('');

            const todayOrders = state.orders.filter(o => isSameBusinessDay(o.timestamp, Date.now()) && (o.orderType==='dine'||o.orderType==='takeaway'));
            const totalRev = todayOrders.reduce((s,o)=>s+(o.total||0),0);
            const morning = todayOrders.filter(o=>o.shift==='morning');
            const night = todayOrders.filter(o=>o.shift==='night');
            const morningRev = morning.reduce((s,o)=>s+(o.total||0),0);
            const nightRev = night.reduce((s,o)=>s+(o.total||0),0);

            const cashierStats = {};
            todayOrders.forEach(o => { if (o.cashier) cashierStats[o.cashier] = (cashierStats[o.cashier]||0)+1; });
            const cashierStatsHtml = Object.entries(cashierStats).length ?
                Object.entries(cashierStats).map(([n,c])=>`<div class="stat-card"><div class="number">${c}</div><div class="label">${n}</div></div>`).join('')
                : '<p style="grid-column:1/-1;color:#94a3b8;">هیچ داتایەک نییە</p>';

            const partnerOrders = state.partnerOrders.filter(o => isSameBusinessDay(o.timestamp, Date.now()));

            return `
                <div>
                    <div class="header-bar">
                        <div class="title">👨‍💼 بەڕێوەبەر <span class="live-indicator"></span> لایڤ</div>
                        <div class="user-info">${state.currentUser || 'بەڕێوەبەر'} | ${now()}</div>
                        <button class="back-btn" data-action="logout">🚪 دەرچوون</button>
                    </div>

                    <div class="manager-menu">
                        <button class="${state.managerTab==='dashboard'?'active':''}" data-action="manager-tab" data-tab="dashboard">📊 داشبۆرد</button>
                        <button class="${state.managerTab==='items'?'active':''}" data-action="manager-tab" data-tab="items">🛒 ئایتمەکان</button>
                        <button class="${state.managerTab==='partner-detail'?'active':''}" data-action="manager-tab" data-tab="partner-detail">📊 شەریکە</button>
                        <button class="${state.managerTab==='monthly-trend'?'active':''}" data-action="manager-tab" data-tab="monthly-trend">📈 ڕەوتی مانگانە</button>
                    </div>

                    ${state.managerTab==='dashboard' ? `
                        <div class="dashboard">
                            <h3 style="font-size:18px;margin-bottom:10px;">📊 داشبۆردی ساڵە و سەفەری <span class="live-indicator"></span> لایڤ</h3>
                            <div class="stats-grid">
                                <div class="stat-card"><div class="number">${formatPrice(morningRev)}</div><div class="label">شەفتی بەیانی (٩-٥:٣٠)</div></div>
                                <div class="stat-card"><div class="number">${formatPrice(nightRev)}</div><div class="label">شەفتی شەو (٥:٣٠-٣)</div></div>
                                <div class="stat-card"><div class="number">${formatPrice(totalRev)}</div><div class="label">کۆی داهاتی ئەمڕۆ</div></div>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-card"><div class="number">${morning.length}</div><div class="label">ئۆردەری بەیانی</div></div>
                                <div class="stat-card"><div class="number">${night.length}</div><div class="label">ئۆردەری شەو</div></div>
                                <div class="stat-card"><div class="number">${todayOrders.length}</div><div class="label">کۆی ئۆردەر</div></div>
                            </div>
                            <h4 style="font-size:15px;margin:12px 0 8px;">📊 ئاماری کاشێرەکان</h4>
                            <div class="stats-grid">${cashierStatsHtml}</div>
                            <h4 style="font-size:15px;margin:12px 0 8px;">📋 کۆی ئۆردەرەکان</h4>
                            <div style="max-height:250px;overflow-y:auto;border:2px solid #e2e8f0;border-radius:10px;padding:8px;">
                                ${todayOrders.length ? todayOrders.map((o,i)=>`
                                    <div class="order-item" style="border-right-color:${o.orderType==='dine'?'#3498db':'#f39c12'};">
                                        <span style="font-weight:700;color:#6c5ce7;">${i+1}</span>
                                        <span class="order-type-badge ${o.orderType}">${o.orderType==='dine'?'🍽️ ساڵە':'🛍️ سەفەری'}</span>
                                        <span style="flex:1;">${o.items.map(it=>`${it.name} ×${it.qty}`).join('، ')}</span>
                                        <span style="font-weight:700;">${formatPrice(o.total)}</span>
                                        ${o.discount>0?`<span style="font-size:9px;color:#e17055;">🔖%${o.discount}</span>`:''}
                                        <span style="font-size:11px;color:#64748b;">${o.time}</span>
                                        <span style="font-size:11px;color:#64748b;">${o.cashier||''}</span>
                                    </div>`).join('') : '<p style="color:#94a3b8;text-align:center;padding:16px;">هیچ ئۆردەرێک نییە</p>'}
                            </div>
                        </div>` : ''}

                    ${state.managerTab==='items' ? `
                        <div class="dashboard">
                            <h3 style="font-size:18px;margin-bottom:10px;">🛒 بەڕێوەبردنی ئایتمەکان</h3>
                            <button class="btn btn-primary" data-action="show-add-item" style="width:auto;display:inline-block;padding:8px 20px;font-size:14px;">➕ زیاد کردنی ئایتم</button>
                            <div style="overflow-x:auto;margin-top:12px;">
                                <table>
                                    <thead><tr><th>ناو / لق</th><th>نرخ</th><th>نرخی شەریکە</th><th>گرووپ</th><th>کردار</th></tr></thead>
                                    <tbody>${itemsHtml || '<tr><td colspan="5" style="color:#94a3b8;">هیچ ئایتمێک نییە</td></tr>'}</tbody>
                                </table>
                            </div>
                        </div>` : ''}

                    ${state.managerTab==='partner-detail' ? renderPartnerDetail() : ''}
                    ${state.managerTab==='monthly-trend' ? renderMonthlyTrend() : ''}
                </div>
            `;
        }

        function renderPartnerDetail() {
            const partnerOrders = state.partnerOrders.filter(o => isSameBusinessDay(o.timestamp, Date.now()));
            return `
                <div class="dashboard" style="margin-top:16px;">
                    <h3 style="font-size:18px;margin-bottom:10px;">📊 دیتەیڵی شەریکەکان <span class="live-indicator"></span></h3>
                    <div class="partner-detail-grid">
                        ${['talabat','zuu','wade','leezu'].map(p => {
                            const orders = partnerOrders.filter(o=>o.partner===p);
                            const total = orders.reduce((s,o)=>s+(o.total||0),0);
                            const logo = `https://i.ibb.co/${p==='talabat'?'gMT6mBmc':p==='zuu'?'gMT6mBmc':p==='wade'?'gMT6mBmc':'gMT6mBmc'}/unnamed.webp`;
                            return `
                                <div class="partner-detail-card" data-partner="${p}">
                                    <div class="partner-detail-header">
                                        <img src="${logo}" class="partner-detail-logo" onerror="this.style.display='none';"/>
                                        <span class="partner-detail-name">${p.toUpperCase()}</span>
                                    </div>
                                    <div class="partner-detail-stats">
                                        <div class="partner-stat"><span class="partner-stat-number">${orders.length}</span><span class="partner-stat-label">کۆی ئۆردەر</span></div>
                                        <div class="partner-stat"><span class="partner-stat-number">${formatPrice(total)}</span><span class="partner-stat-label">کۆی داهات</span></div>
                                    </div>
                                    <div class="partner-detail-orders">
                                        ${orders.length ? orders.map(o=>`
                                            <div class="partner-order-item">
                                                <span class="partner-order-id">#${o.id||'N/A'}</span>
                                                <span class="partner-order-items">${o.items?o.items.map(i=>`${i.name} ×${i.qty}`).join('، '):''}</span>
                                                ${o.partnerCode?`<span class="partner-order-code">📦 ${o.partnerCode}</span>`:''}
                                                <span class="partner-order-total">${formatPrice(o.total||0)}</span>
                                                <span class="partner-order-time">${o.time||''}</span>
                                            </div>`).join('') : '<p class="no-orders">هیچ ئۆردەرێک نییە</p>'}
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        function renderMonthlyTrend() {
            const monthDays = getMonthDays();
            const monthStart = getMonthStart(new Date());
            const monthEnd = getMonthEnd(new Date());
            const monthName = getMonthNameKurdish(new Date());
            const year = new Date().getFullYear();
            const totalDays = monthDays.length;

            const monthlyFiltered = state.orders.filter(o => !(o.partner && o.orderType==='partner') && (o.orderType==='dine'||o.orderType==='takeaway'));

            const dayData = monthDays.map(day => {
                const dayOrders = monthlyFiltered.filter(o => getBusinessDayStart(o.timestamp).getTime() === getBusinessDayStart(day).getTime());
                return { day, total: dayOrders.reduce((s,o)=>s+(o.total||0),0), count: dayOrders.length };
            });

            const maxTotal = Math.max(...dayData.map(d=>d.total), 1);
            const monthlyTotal = dayData.reduce((s,d)=>s+d.total, 0);
            const avgDaily = totalDays > 0 ? Math.round(monthlyTotal/totalDays) : 0;
            const totalOrders = dayData.reduce((s,d)=>s+d.count, 0);
            const todayStr = new Date().toDateString();

            const cards = dayData.map(d => {
                const isToday = d.day.toDateString() === todayStr;
                const hasData = d.total > 0;
                const isMax = d.total > 0 && d.total === maxTotal;
                const bar = Math.max((d.total/maxTotal)*100, 0);
                let cls = 'day-card' + (isToday?' today':'') + (hasData?' has-data':' empty');
                return `
                    <div class="${cls}">
                        ${isMax?'<span class="day-badge max">⭐ بەرزترین</span>':(isToday?'<span class="day-badge">ئەمڕۆ</span>':'')}
                        <div class="day-header"><span class="day-num">${d.day.getDate()}</span><span class="day-name">${getDayName(d.day)}</span></div>
                        <div class="day-amount">${hasData?formatPrice(d.total):'0 د.ع'}</div>
                        <div class="day-orders-count"><span class="dot" style="background:${hasData?'#00b894':'#cbd5e1'}"></span>${d.count} ئۆردەر</div>
                        <div class="day-bar"><div class="day-bar-fill" style="width:${bar}%"></div></div>
                    </div>`;
            }).join('');

            return `
                <div class="monthly-trend-page">
                    <div class="monthly-trend-header">
                        <h3>📈 ڕەوتی مانگانە <span class="live-indicator"></span></h3>
                        <div class="monthly-trend-summary">
                            <div class="summary-box"><span class="val">${formatPrice(monthlyTotal)}</span><span class="lbl">کۆی مانگ</span></div>
                            <div class="summary-box alt"><span class="val">${formatPrice(avgDaily)}</span><span class="lbl">تێکڕای ڕۆژانە</span></div>
                            <div class="summary-box alt2"><span class="val">${totalOrders}</span><span class="lbl">کۆی ئۆردەر</span></div>
                        </div>
                    </div>
                    <div class="month-info-bar">
                        <span class="month-name">📅 ${monthName} ${year}</span>
                        <span class="month-dates">${formatDateKurdish(monthStart)} → ${formatDateKurdish(monthEnd)}</span>
                        <span class="month-days-count">${totalDays} ڕۆژ</span>
                    </div>
                    <div class="day-cards-grid">${cards}</div>
                </div>`;
        }

        function renderItemModal() {
            const isEdit = !!state.editingItemId;
            const item = isEdit ? state.items.find(i=>i.id===state.editingItemId) : null;
            return `
                <div class="modal-overlay" id="item-modal-overlay">
                    <div class="modal">
                        <button class="close-btn" id="close-item-modal">✕</button>
                        <h3>${isEdit?'✏️ نوێ کردنەوە':'➕ زیاد کردن'}</h3>
                        <div class="form-group"><label>ناو</label><input type="text" id="item-name" value="${item?item.name:''}"/></div>
                        <div class="form-group"><label>نرخ</label><input type="number" id="item-price" value="${item?item.price:''}" step="100"/></div>
                        <div class="form-group"><label>گرووپ</label>
                            <select id="item-group">
                                <option value="">-- هەڵبژێرە --</option>
                                ${GROUP_OPTIONS.map(g=>`<option value="${g}" ${item&&item.group===g?'selected':''}>${g}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group"><label>لینکی وێنە</label><input type="text" id="item-image" value="${item?item.image||'':''}"/></div>
                        <hr style="margin:12px 0;border-color:#e2e8f0;"/>
                        <h4 style="margin-bottom:8px;">نرخی شەریکەکان</h4>
                        ${['talabat','zuu','wade','leezu'].map(p=>`
                            <div class="form-group"><label>${p.toUpperCase()}</label>
                                <input type="number" id="partner-price-${p}" value="${item&&item.partnerPrices&&item.partnerPrices[p]!=null?item.partnerPrices[p]:''}" step="100"/>
                            </div>`).join('')}
                        <div class="flex" style="margin-top:12px;gap:8px;">
                            <button class="btn" id="save-item-btn" style="flex:1;">${isEdit?'💾 نوێکردنەوە':'➕ زیادکردن'}</button>
                            <button class="btn btn-danger" id="cancel-item-btn" style="flex:1;">🚫 ڕەتکردنەوە</button>
                        </div>
                    </div>
                </div>`;
        }

        // ============ EVENTS ============
        function attachEvents() {
            document.querySelectorAll('[data-action="login-manager"]').forEach(el => {
                el.onclick = () => {
                    const u = document.getElementById('username')?.value.trim();
                    const p = document.getElementById('password')?.value.trim();
                    if (u === 's4ng4r' && p === 's2026s') {
                        state.currentUser = u;
                        state.currentRole = 'manager';
                        state.currentPage = 'manager';
                        state.managerTab = 'dashboard';
                        toast('بەخێربێیت بەڕێوەبەر');
                        render();
                    } else toast('ناو یان تێپەڕەوشە هەڵەیە', true);
                };
            });

            document.querySelectorAll('[data-action="logout"]').forEach(el => {
                el.onclick = () => {
                    state.currentPage = 'login';
                    state.currentUser = null;
                    state.currentRole = null;
                    state.showItemModal = false;
                    state.editingItemId = null;
                    render();
                };
            });

            document.querySelectorAll('[data-action="manager-tab"]').forEach(el => {
                el.onclick = () => { state.managerTab = el.dataset.tab; render(); };
            });

            document.querySelectorAll('[data-action="show-add-item"]').forEach(el => {
                el.onclick = () => { state.showItemModal = true; state.editingItemId = null; render(); };
            });

            document.querySelectorAll('[data-action="edit-item"]').forEach(el => {
                el.onclick = () => { state.editingItemId = el.dataset.id; state.showItemModal = true; render(); };
            });

            document.querySelectorAll('[data-action="delete-item"]').forEach(el => {
                el.onclick = async () => {
                    if (confirm('دڵنیای؟')) {
                        state.items = state.items.filter(i => i.id !== el.dataset.id);
                        await saveItemsToFirestore();
                        render();
                    }
                };
            });

            const closeBtn = document.getElementById('close-item-modal');
            if (closeBtn) closeBtn.onclick = () => { state.showItemModal=false; state.editingItemId=null; render(); };
            const cancelBtn = document.getElementById('cancel-item-btn');
            if (cancelBtn) cancelBtn.onclick = () => { state.showItemModal=false; state.editingItemId=null; render(); };
            const overlay = document.getElementById('item-modal-overlay');
            if (overlay) overlay.onclick = (e) => { if (e.target===overlay) { state.showItemModal=false; state.editingItemId=null; render(); } };

            const saveBtn = document.getElementById('save-item-btn');
            if (saveBtn) saveBtn.onclick = async () => {
                const name = document.getElementById('item-name')?.value.trim();
                const price = parseFloat(document.getElementById('item-price')?.value);
                const group = document.getElementById('item-group')?.value.trim();
                const image = document.getElementById('item-image')?.value.trim();
                if (!name) return toast('ناو داخل بکە', true);
                if (isNaN(price) || price <= 0) return toast('نرخی دروست داخل بکە', true);
                const pp = {};
                ['talabat','zuu','wade','leezu'].forEach(p => {
                    const v = document.getElementById(`partner-price-${p}`)?.value;
                    pp[p] = v && !isNaN(parseFloat(v)) ? parseFloat(v) : null;
                });
                if (state.editingItemId) {
                    const it = state.items.find(i=>i.id===state.editingItemId);
                    if (it) { it.name=name; it.price=price; it.group=group||'گشتی'; it.image=image||''; it.partnerPrices=pp; }
                } else {
                    state.items.push({ id: genId(), name, price, group: group||'گشتی', branch:'زانکۆ', image: image||'', partnerPrices: pp });
                }
                await saveItemsToFirestore();
                state.showItemModal = false; state.editingItemId = null;
                render();
            };

            document.querySelectorAll('.partner-detail-card').forEach(el => {
                el.onclick = () => { el.classList.toggle('expanded'); el.scrollIntoView({behavior:'smooth',block:'center'}); };
            });
        }

        // ============ INIT ============
        async function init() {
            state.isLoading = true;
            render();
            try {
                try { await signInAnonymously(auth); } catch(e) {}
                await loadResetTimestamps();
                loadItemsFromFirestore();
                loadOrdersFromFirestore();
                loadPartnerOrdersFromFirestore();
                setInterval(() => checkAndApplyResets(), 60000);
            } catch(e) {
                state.firebaseError = e.message;
                state.isLoading = false;
                render();
            }
        }

        init();
    </script>
</body>
</html>
