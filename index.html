<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#6c5ce7" />
    <title>بەڕێوەبەر - چێشتخانەی ئایس پۆپ</title>
    <style>
        /* ============================================================
           DESIGN TOKENS
           ============================================================ */
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5a4bd1;
            --primary-light: #a29bfe;
            --primary-soft: #f0efff;
            --success: #00b894;
            --success-dark: #00a381;
            --success-soft: #e6fbf4;
            --danger: #ff6b6b;
            --warning: #fdcb6e;
            --warning-dark: #f0b84d;
            --ink: #1a1a2e;
            --ink-2: #3d3d5c;
            --muted: #64748b;
            --muted-2: #94a3b8;
            --line: #e2e8f0;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --bg: #f0f2f5;

            --r-sm: 10px;
            --r-md: 14px;
            --r-lg: 20px;
            --r-xl: 24px;

            --shadow-sm: 0 2px 8px rgba(15, 15, 40, .05);
            --shadow-md: 0 8px 24px rgba(15, 15, 40, .08);
            --shadow-lg: 0 20px 50px rgba(15, 15, 40, .12);
            --shadow-primary: 0 8px 24px rgba(108, 92, 231, .28);

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --nav-h: 68px;
        }

        /* ============================================================
           BASE
           ============================================================ */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        html, body { max-width:100%; overflow-x:hidden; }
        body {
            background: var(--bg);
            min-height:100vh;
            font-family:'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            color: var(--ink);
            padding: 0;
            padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
        }
        #app {
            width:100%;
            max-width:1400px;
            margin:0 auto;
            min-height:100vh;
            padding: 12px;
            padding-top: calc(12px + var(--safe-top));
            padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
            display:inline-flex; align-items:center; justify-content:center; gap:6px;
            background: var(--primary); color:#fff; border:none;
            padding:14px 24px; border-radius: var(--r-md);
            font-size:16px; font-weight:600; cursor:pointer;
            transition: transform .2s, background .2s, box-shadow .2s;
            width:100%; margin:6px 0;
            font-family:inherit;
        }
        .btn:hover { background: var(--primary-dark); box-shadow: var(--shadow-primary); transform: translateY(-1px); }
        .btn:active { transform: translateY(0) scale(.99); }
        .btn-sm { padding:8px 14px; font-size:13px; width:auto; margin:2px; border-radius: var(--r-sm); }
        .btn-success { background: var(--success); } .btn-success:hover { background: var(--success-dark); box-shadow: 0 8px 20px rgba(0,184,148,.28); }
        .btn-danger { background: var(--danger); }  .btn-danger:hover  { background: #e55a5a; box-shadow: 0 8px 20px rgba(255,107,107,.28); }
        .btn-warning { background: var(--warning); color: var(--ink); } .btn-warning:hover { background: var(--warning-dark); }
        .btn-primary { background: var(--primary); } .btn-primary:hover { background: var(--primary-dark); }

        /* ============================================================
           LOGIN
           ============================================================ */
        .login-page {
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            min-height: calc(100vh - var(--nav-h) - 24px);
            gap:20px; padding: 0 4px;
        }
        .login-box {
            background: var(--surface); padding: 32px 24px;
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-lg);
            width:100%; max-width:420px; text-align:center;
            position:relative; overflow:hidden;
        }
        .login-box::before {
            content:''; position:absolute; top:-50%; right:-20%; width:200px; height:200px;
            background: radial-gradient(circle, var(--primary-soft), transparent 70%);
            pointer-events:none;
        }
        .login-box > * { position:relative; }
        .logo-text { font-size:30px; font-weight:800; color: var(--ink); margin-bottom:6px; }
        .logo-text span { color: var(--primary); }
        .subtitle { color: var(--muted); font-size:13px; margin-bottom:16px; }
        .login-box h2 { font-size:22px; margin-bottom:18px; color: var(--ink); font-weight:700; }
        .login-box input {
            width:100%; padding:15px 18px; margin:8px 0;
            border:2px solid var(--line); border-radius: var(--r-md);
            font-size:16px; background: var(--surface-2);
            transition: .25s; font-family:inherit; color: var(--ink);
        }
        .login-box input:focus {
            border-color: var(--primary); outline:none; background:#fff;
            box-shadow: 0 0 0 4px rgba(108,92,231,.12);
        }

        /* ============================================================
           HEADER (glass)
           ============================================================ */
        .header-bar {
            position: sticky; top: 0; z-index: 50;
            display:flex; align-items:center; justify-content:space-between;
            gap:8px; flex-wrap:wrap;
            padding: 10px 14px;
            margin: -12px -12px 14px;
            margin-top: calc(-12px - var(--safe-top));
            padding-top: calc(10px + var(--safe-top));
            background: rgba(255,255,255,.82);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border-bottom: 1px solid rgba(226,232,240,.7);
        }
        .header-bar .title {
            font-size:16px; font-weight:800; color: var(--ink);
            display:flex; align-items:center; gap:6px; min-width:0;
        }
        .header-bar .user-info {
            color: var(--muted); font-weight:600; font-size:12px;
            background: var(--surface-2); padding: 4px 10px; border-radius: 999px;
            min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .back-btn {
            background: var(--surface-2); border:1px solid var(--line);
            color: var(--danger); font-size:13px; font-weight:700;
            cursor:pointer; padding: 6px 12px; border-radius: 999px;
            white-space:nowrap; font-family:inherit;
            transition: .2s;
        }
        .back-btn:hover { background: #fff5f5; border-color: #ffd5d5; }

        /* ============================================================
           TAB NAV (mobile = bottom bar / desktop = inline)
           ============================================================ */
        .manager-menu {
            display:flex; gap:6px;
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 6px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .manager-menu::-webkit-scrollbar { display:none; }
        .manager-menu button {
            flex: 1 0 auto;
            padding: 11px 14px;
            border: 0; border-radius: var(--r-md);
            background: transparent;
            font-weight: 700; cursor: pointer; font-size: 13px;
            color: var(--muted);
            transition: .2s;
            white-space: nowrap;
            font-family:inherit;
            display:flex; align-items:center; justify-content:center; gap:6px;
        }
        .manager-menu button:hover { color: var(--primary); background: var(--primary-soft); }
        .manager-menu button.active {
            background: var(--primary); color:#fff;
            box-shadow: var(--shadow-primary);
        }

        /* ============================================================
           DASHBOARD CARD
           ============================================================ */
        .dashboard {
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 15px; font-weight: 800; color: var(--ink);
            margin: 16px 0 10px;
            display:flex; align-items:center; gap:8px;
        }
        .section-title::before {
            content:''; width: 4px; height: 16px; border-radius: 4px;
            background: var(--primary);
        }

        /* ============================================================
           STAT CARDS - تەواو ڕێکخراو
           ============================================================ */
        .stats-grid {
            display:grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 8px;
        }
        /* کارتەکانی ناوەڕاست بۆ ئەوەی لای چەپ بەتاڵ نەبێت */
        .stats-grid > .stat-card:last-child:nth-child(odd) {
            grid-column: 1 / -1;
        }
        .stat-card {
            background: var(--surface-2);
            border: 1.5px solid var(--line);
            border-radius: var(--r-md);
            padding: 14px 10px;
            text-align: center;
            transition: .25s;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90px; /* بۆ ئەوەی هەموو یەکسان بن */
        }
        .stat-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .stat-card .number {
            font-size: 20px; font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
            word-break: break-word; overflow-wrap: anywhere;
            letter-spacing: -.02em;
        }
        .stat-card .label {
            font-size: 12px; color: var(--muted); margin-top: 4px;
            font-weight: 600; word-break: break-word;
        }

        /* Highlighted cards (gradient) */
        .stat-card.accent {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: transparent; color: #fff;
            box-shadow: var(--shadow-primary);
        }
        .stat-card.accent .number { color: #fff; }
        .stat-card.accent .label  { color: rgba(255,255,255,.85); }
        .stat-card.green {
            background: linear-gradient(135deg, var(--success), var(--success-dark));
            border-color: transparent; color: #fff;
            box-shadow: 0 8px 24px rgba(0,184,148,.28);
        }
        .stat-card.green .number { color: #fff; }
        .stat-card.green .label  { color: rgba(255,255,255,.9); }

        /* ============================================================
           ORDER LIST
           ============================================================ */
        .order-scroll {
            max-height: 320px; overflow-y: auto;
            border: 1.5px solid var(--line); border-radius: var(--r-md);
            padding: 8px; background: var(--surface-2);
            -webkit-overflow-scrolling: touch;
        }
        .order-item {
            display: flex; flex-wrap: wrap; align-items: center;
            gap: 6px 8px;
            padding: 10px 12px;
            background: #fff;
            border-radius: var(--r-sm);
            margin-bottom: 6px;
            box-shadow: var(--shadow-sm);
            border-right: 4px solid var(--primary);
            font-size: 13px;
            min-width: 0;
        }
        .order-item:last-child { margin-bottom: 0; }
        .order-item > * { min-width: 0; }
        .order-item .order-index {
            font-weight: 800; color: var(--primary);
            background: var(--primary-soft);
            width: 22px; height: 22px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; flex-shrink: 0;
        }
        .order-item .order-text {
            flex: 1 1 100%;
            word-break: break-word; overflow-wrap: anywhere;
            color: var(--ink-2); font-weight: 600;
        }
        .order-item .order-total {
            font-weight: 800; white-space: nowrap;
            color: var(--ink); font-size: 13px; margin-right: auto;
        }
        .order-item .order-meta {
            font-size: 11px; color: var(--muted);
            white-space: nowrap; font-weight: 600;
        }
        .order-type-badge {
            display: inline-block; padding: 3px 9px; border-radius: 999px;
            font-size: 10px; font-weight: 700; white-space: nowrap;
        }
        .order-type-badge.dine { background: #e6f1ff; color: #2980b9; }
        .order-type-badge.takeaway { background: #fff3e0; color: #d97706; }

        /* ============================================================
           ITEMS TABLE
           ============================================================ */
        .table-wrap {
            overflow-x: auto;
            margin-top: 12px;
            border-radius: var(--r-md);
            border: 1.5px solid var(--line);
            -webkit-overflow-scrolling: touch;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table th, table td {
            padding: 10px 8px; text-align: right;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
            word-break: break-word;
        }
        table th {
            background: var(--surface-2);
            font-weight: 800; font-size: 11px;
            white-space: nowrap; color: var(--muted);
            text-transform: uppercase; letter-spacing: .04em;
        }
        table tr:hover td { background: var(--surface-2); }
        table tr:last-child td { border-bottom: none; }

        .branch-tag {
            display: inline-block; padding: 2px 8px; border-radius: 999px;
            font-size: 10px; font-weight: 700; margin-right: 3px;
        }
        .branch-tag.zanco { background: #e6f1ff; color: #2980b9; }

        /* ============================================================
           PARTNER CARDS
           ============================================================ */
        .partner-detail-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .partner-detail-card {
            background: linear-gradient(160deg, #fff, var(--surface-2));
            border: 1.5px solid var(--line);
            border-radius: var(--r-lg);
            padding: 14px;
            transition: .3s;
            cursor: pointer;
            min-width: 0;
            overflow: hidden;
        }
        .partner-detail-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .partner-detail-card.expanded { grid-column: 1 / -1; }
        .partner-detail-card.expanded .partner-detail-orders { max-height: 400px; }
        .partner-detail-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: 1.5px dashed var(--line);
            min-width: 0;
        }
        .partner-detail-logo {
            width: 42px; height: 42px; border-radius: var(--r-sm);
            object-fit: contain; background: #fff; padding: 4px;
            border: 1px solid var(--line);
            flex-shrink: 0;
        }
        .partner-detail-name {
            font-size: 16px; font-weight: 800; color: var(--ink);
            min-width: 0; word-break: break-word;
        }
        .partner-detail-stats {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; margin-bottom: 10px;
        }
        .partner-stat {
            background: #fff; border-radius: var(--r-sm);
            padding: 10px 6px; text-align: center;
            border: 1px solid var(--line); min-width: 0;
        }
        .partner-stat-number {
            display: block; font-size: 16px; font-weight: 800;
            color: var(--primary);
            word-break: break-word; overflow-wrap: anywhere;
            line-height: 1.2;
        }
        .partner-stat-label { font-size: 10px; color: var(--muted); font-weight: 600; }

        .partner-detail-orders {
            background: #fff; border-radius: var(--r-sm);
            padding: 8px; max-height: 180px; overflow-y: auto;
            transition: max-height .3s;
            border: 1px solid var(--line);
        }
        .partner-order-item {
            display: flex; flex-wrap: wrap; align-items: center;
            gap: 4px 8px;
            padding: 8px 4px;
            border-bottom: 1px dashed #f1f5f9;
            font-size: 12px; min-width: 0;
        }
        .partner-order-item:last-child { border-bottom: none; }
        .partner-order-id {
            font-weight: 800; color: var(--primary);
            font-size: 11px; white-space: nowrap;
            background: var(--primary-soft); padding: 2px 8px; border-radius: 999px;
        }
        .partner-order-items {
            flex: 1 1 100px; color: var(--ink-2); font-size: 11px;
            min-width: 0; word-break: break-word; overflow-wrap: anywhere;
        }
        .partner-order-code {
            background: #fff3e0; color: #d97706;
            padding: 2px 8px; border-radius: 999px;
            font-size: 10px; font-weight: 700; white-space: nowrap;
        }
        .partner-order-total {
            font-weight: 800; color: var(--ink);
            font-size: 12px; white-space: nowrap;
        }
        .partner-order-time {
            color: var(--muted-2); font-size: 10px; white-space: nowrap;
        }
        .no-orders {
            color: var(--muted-2); text-align: center;
            padding: 18px; font-size: 13px;
        }

        /* ============================================================
           MONTHLY TREND
           ============================================================ */
        .monthly-trend-page {
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 16px;
            box-shadow: var(--shadow-md);
        }
        .monthly-trend-header {
            display: flex; flex-direction: column; gap: 12px;
            margin-bottom: 16px; padding-bottom: 14px;
            border-bottom: 3px solid var(--primary);
        }
        .monthly-trend-header h3 {
            font-size: 18px; font-weight: 800; color: var(--ink); margin: 0;
            display: flex; align-items: center; gap: 6px;
        }
        .monthly-trend-summary {
            display: grid; grid-template-columns: 1fr; gap: 8px;
        }
        .monthly-trend-summary .summary-box {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; padding: 12px 14px; border-radius: var(--r-md);
            text-align: center; min-width: 0;
            box-shadow: var(--shadow-primary);
        }
        .monthly-trend-summary .summary-box .val {
            font-size: 16px; font-weight: 800; display: block;
            word-break: break-word; overflow-wrap: anywhere;
        }
        .monthly-trend-summary .summary-box .lbl {
            font-size: 10px; opacity: .9; display: block; margin-top: 3px; font-weight: 600;
        }
        .monthly-trend-summary .summary-box.alt {
            background: linear-gradient(135deg, var(--success), var(--success-dark));
            box-shadow: 0 8px 24px rgba(0,184,148,.28);
        }
        .monthly-trend-summary .summary-box.alt2 {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 8px 24px rgba(225,112,85,.28);
        }

        .month-info-bar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
            background: linear-gradient(135deg, var(--primary-soft), #f7f5ff);
            border: 1.5px solid var(--line); border-radius: var(--r-md);
            padding: 12px 14px; margin-bottom: 14px;
        }
        .month-info-bar .month-name {
            font-size: 15px; font-weight: 800; color: var(--primary);
            word-break: break-word;
        }
        .month-info-bar .month-dates {
            font-size: 12px; color: var(--muted); font-weight: 600;
            word-break: break-word;
        }
        .month-info-bar .month-days-count {
            background: var(--primary); color: #fff;
            padding: 4px 12px; border-radius: 999px;
            font-size: 11px; font-weight: 700;
            white-space: nowrap; margin-right: auto;
        }

        .day-cards-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .day-card {
            background: var(--surface-2);
            border-radius: var(--r-md);
            padding: 12px;
            border: 1.5px solid var(--line);
            transition: all .25s;
            position: relative;
            overflow: hidden;
            display: flex; flex-direction: column; gap: 6px;
            min-height: 120px; min-width: 0;
        }
        .day-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .day-card.today {
            border-color: var(--primary);
            background: linear-gradient(135deg, var(--primary-soft), #fbfaff);
            box-shadow: 0 6px 20px rgba(108,92,231,.12);
        }
        .day-card.has-data {
            background: linear-gradient(135deg, var(--success-soft), #f8fffc);
            border-color: var(--success);
        }
        .day-card.has-data.today {
            background: linear-gradient(135deg, var(--primary-soft), var(--success-soft));
            border-color: var(--primary);
        }
        .day-card .day-header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 4px; flex-wrap: wrap;
        }
        .day-card .day-num {
            font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1;
        }
        .day-card.today .day-num { color: var(--primary); }
        .day-card.has-data .day-num { color: var(--success); }
        .day-card.has-data.today .day-num { color: var(--primary); }
        .day-card .day-name {
            font-size: 10px; color: var(--muted); font-weight: 700;
            background: #fff; padding: 2px 8px; border-radius: 999px;
            white-space: nowrap;
        }
        .day-card .day-amount {
            font-size: 14px; font-weight: 800; color: var(--ink);
            margin-top: auto;
            word-break: break-word; overflow-wrap: anywhere;
            line-height: 1.25;
        }
        .day-card.has-data .day-amount { color: var(--success); }
        .day-card.today .day-amount { color: var(--primary); }
        .day-card .day-orders-count {
            font-size: 10px; color: var(--muted); font-weight: 700;
            display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
        }
        .day-card .day-orders-count .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--success); flex-shrink: 0;
        }
        .day-card .day-badge {
            position: absolute; top: 6px; left: 6px;
            font-size: 9px; font-weight: 800;
            padding: 2px 7px; border-radius: 6px;
            background: var(--primary); color: #fff;
            white-space: nowrap;
        }
        .day-card .day-badge.max {
            background: var(--warning); color: var(--ink);
        }
        .day-card .day-bar {
            height: 4px; background: var(--line);
            border-radius: 4px; overflow: hidden; margin-top: 2px;
        }
        .day-card .day-bar-fill {
            height: 100%; border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width .6s ease;
        }
        .day-card.has-data .day-bar-fill {
            background: linear-gradient(90deg, var(--success), #55efc4);
        }
        .day-card.empty .day-amount {
            color: var(--muted-2); font-size: 12px; font-weight: 500;
        }

        /* ============================================================
           MODAL (bottom sheet on mobile)
           ============================================================ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(15, 15, 40, .5);
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 0;
            animation: fadeIn .2s ease;
        }
        .modal {
            background: #fff;
            border-radius: var(--r-xl) var(--r-xl) 0 0;
            padding: 20px 20px calc(20px + var(--safe-bottom));
            width: 100%; max-width: 500px;
            max-height: 92vh; overflow-y: auto;
            box-shadow: 0 -20px 60px rgba(0,0,0,.2);
            animation: slideUpSheet .3s cubic-bezier(.2,.9,.3,1);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpSheet {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal::before {
            content:''; display:block; width: 40px; height: 4px;
            background: var(--line); border-radius: 2px; margin: -8px auto 12px;
        }
        .modal h3 { font-size: 20px; margin-bottom: 14px; color: var(--ink); font-weight: 800; }
        .modal .close-btn {
            float: left; background: var(--surface-2); border: none;
            font-size: 18px; cursor: pointer; color: var(--muted);
            width: 32px; height: 32px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            transition: .2s;
        }
        .modal .close-btn:hover { background: #ffe5e5; color: var(--danger); }

        .form-group { margin-bottom: 12px; }
        .form-group label {
            font-weight: 700; display: block; margin-bottom: 5px;
            color: var(--ink); font-size: 13px;
        }
        select, input[type="text"], input[type="number"] {
            padding: 12px 14px;
            border: 1.5px solid var(--line);
            border-radius: var(--r-md);
            font-size: 15px; width: 100%;
            background: var(--surface-2);
            transition: .2s; font-family: inherit; color: var(--ink);
        }
        select:focus, input:focus {
            border-color: var(--primary); outline: none; background: #fff;
            box-shadow: 0 0 0 3px rgba(108,92,231,.1);
        }

        /* ============================================================
           LIVE DOT / TOAST / LOADING
           ============================================================ */
        .live-indicator {
            display: inline-block; width: 8px; height: 8px;
            background: var(--success); border-radius: 50%;
            animation: pulse 1.5s infinite; margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .toast {
            position: fixed;
            bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
            right: 16px; left: 16px;
            background: var(--success); color: #fff;
            padding: 14px 20px; border-radius: var(--r-md);
            box-shadow: var(--shadow-lg);
            font-weight: 700; z-index: 1100;
            animation: slideUp .4s cubic-bezier(.2,.9,.3,1);
            max-width: 400px; margin: 0 auto; text-align: center;
            font-size: 14px;
        }
        .toast.error { background: var(--danger); }
        @keyframes slideUp {
            from { transform: translateY(80px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .loading-overlay {
            position: fixed; inset: 0;
            background: rgba(255,255,255,.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; gap: 16px;
            color: var(--primary); font-size: 16px; font-weight: 700;
        }
        .loading-overlay .spinner {
            width: 44px; height: 44px;
            border: 4px solid var(--line);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-container {
            padding: 30px; text-align: center;
            background: #fff; border-radius: var(--r-lg);
            box-shadow: var(--shadow-lg); margin: 20px auto; max-width: 420px;
        }
        .error-container h2 { color: var(--danger); margin-bottom: 12px; }
        .error-container p { color: var(--muted); margin-bottom: 16px; }

        /* ============================================================
           BOTTOM NAV — mobile only
           ============================================================ */
        @media (max-width: 767px) {
            #app { padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }
            .manager-menu {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                z-index: 100;
                border-radius: 0;
                padding: 6px 8px;
                padding-bottom: calc(6px + var(--safe-bottom));
                margin: 0;
                box-shadow: 0 -8px 30px rgba(15,15,40,.1);
                background: rgba(255,255,255,.94);
                backdrop-filter: blur(14px) saturate(180%);
                -webkit-backdrop-filter: blur(14px) saturate(180%);
                border-top: 1px solid rgba(226,232,240,.7);
                overflow: visible;
                justify-content: space-around;
                gap: 4px;
            }
            .manager-menu button {
                flex: 1;
                flex-direction: column;
                gap: 4px;
                font-size: 10px; /* فۆنتی بچووکتر */
                padding: 6px 2px;
                min-width: 0;
                border-radius: var(--r-sm);
            }
            .manager-menu button.active {
                background: var(--primary-soft);
                color: var(--primary);
                box-shadow: none;
            }
            .dashboard, .monthly-trend-page { margin-bottom: 0; }
        }

        /* ============================================================
           RESPONSIVE TWEAKS
           ============================================================ */
        /* 360px+ : 3 summary boxes */
        @media (min-width: 360px) {
            .monthly-trend-summary { grid-template-columns: repeat(3, 1fr); }
            .stat-card .number { font-size: 22px; }
        }

        /* 430px+ : day cards 3 */
        @media (min-width: 430px) {
            .day-cards-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
        }

        /* 560px+ : tablet */
        @media (min-width: 560px) {
            .partner-detail-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
            .day-cards-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
            .stat-card .number { font-size: 24px; }
            .stat-card .label { font-size: 13px; }
        }

        /* 768px+ : desktop, undo bottom nav */
        @media (min-width: 768px) {
            body { padding-bottom: 12px; }
            #app { padding: 12px; padding-top: 12px; }
            .header-bar { position: static; margin: -12px -12px 14px; padding: 12px 16px; border-radius: 0; }
            .manager-menu {
                position: static;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                background: var(--surface);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                border: 1.5px solid var(--line);
                box-shadow: var(--shadow-sm);
                padding: 6px;
                gap: 6px;
                margin-bottom: 16px;
                border-radius: var(--r-lg);
            }
            .manager-menu button {
                flex-direction: row;
                gap: 6px;
                font-size: 13px;
                padding: 11px 14px;
            }
            .modal-overlay { align-items: center; padding: 16px; }
            .modal {
                border-radius: var(--r-xl);
                max-height: 90vh;
                animation: slideUpModal .3s ease;
            }
            @keyframes slideUpModal {
                from { transform: translateY(30px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
            .modal::before { display: none; }
            .monthly-trend-summary { grid-template-columns: repeat(3, 1fr); }
            .day-cards-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .order-item .order-text { flex: 1 1 auto; }
            .stats-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
        }

        /* 1024px+ */
        @media (min-width: 1024px) {
            .partner-detail-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
            .stats-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        }

        /* Very small (<=340px) */
        @media (max-width: 340px) {
            #app { padding: 8px; padding-top: calc(8px + var(--safe-top)); }
            .dashboard, .monthly-trend-page { padding: 12px; border-radius: var(--r-md); }
            .stat-card { padding: 10px 6px; min-height: 80px;}
            .stat-card .number { font-size: 18px; }
            .manager-menu button { font-size: 9px; padding: 6px 2px; }
            .order-item { font-size: 12px; padding: 8px 10px; }
            .partner-detail-card { padding: 10px; }
            .day-card { min-height: 108px; padding: 10px; }
            .day-card .day-num { font-size: 18px; }
            .day-card .day-amount { font-size: 13px; }
        }

        /* Accessibility — reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js",
            "firebase/storage": "https://www.gstatic.com/firebasejs/12.15.0/firebase-storage.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js"
        }
    }
    </script>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getFirestore, doc, onSnapshot, updateDoc, setDoc, getDoc, collection } from 'firebase/firestore';
        import { getStorage } from 'firebase/storage';
        import { getAuth, signInAnonymously } from 'firebase/auth';

        const firebaseConfig = {
            apiKey: "AIzaSyDpMvqqiMJF_bcoAOEC4gC9CJrvdDlJVMA",
            authDomain: "icepop-3ed45.firebaseapp.com",
            projectId: "icepop-3ed45",
            storageBucket: "icepop-3ed45.firebasestorage.app",
            messagingSenderId: "635220816671",
            appId: "1:635220816671:web:71a452ec17bacd3ee0b62a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        const COLLECTION_NAME = 'sis';
        const DOCUMENT_ID = 'LW1DtX6N4s0o97o1vaz';
        const docRef = doc(db, COLLECTION_NAME, DOCUMENT_ID);
        const PARTNER_ORDERS_COLLECTION = 'partner_orders';

        const GROUP_OPTIONS = ['پیتزا','بەرگر','سپاگێتی','فینگەر','لەفە','مریشک','ماسی','خواردنەوەکان'];

        // ============ BUSINESS DAY UTILS ============
        function getBusinessDayStart(timestamp) {
            const d = new Date(timestamp);
            if (d.getHours() < 2 || (d.getHours() === 2 && d.getMinutes() < 30)) {
                const p = new Date(d); p.setDate(p.getDate() - 1);
                return new Date(p.getFullYear(), p.getMonth(), p.getDate(), 0, 0, 0, 0);
            }
            return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
        }
        function isSameBusinessDay(a, b) {
            return getBusinessDayStart(a).getTime() === getBusinessDayStart(b).getTime();
        }
        function getCurrentBusinessDayStart() { return getBusinessDayStart(new Date()); }

        function getDaysInMonth(date) { return new Date(date.getFullYear(), date.getMonth()+1, 0).getDate(); }
        function getMonthStart(date) { return new Date(date.getFullYear(), date.getMonth(), 1, 0,0,0,0); }
        function getMonthEnd(date) { return new Date(date.getFullYear(), date.getMonth(), getDaysInMonth(date), 23,59,59,999); }
        function getMonthDays(ref = new Date()) {
            const days = []; const total = getDaysInMonth(ref);
            for (let i = 1; i <= total; i++) days.push(new Date(ref.getFullYear(), ref.getMonth(), i));
            return days;
        }
        function getMonthNameKurdish(date) {
            return ['کانونی دووەم','شوبات','ئازار','نیسان','ئایار','حوزەیران','تەمموز','ئاب','ئەیلوول','تشرینی یەکەم','تشرینی دووەم','کانونی یەکەم'][new Date(date).getMonth()];
        }
        function formatDateKurdish(date) {
            const d = new Date(date);
            return `${d.getDate()} ${getMonthNameKurdish(d)} ${d.getFullYear()}`;
        }
        function getDayName(date) {
            return ['یەکشەممە','دووشەممە','سێشەممە','چوارشەممە','پێنجشەممە','هەینی','شەممە'][date.getDay()];
        }

        function formatPrice(p) {
            if (!p && p !== 0) return '0 د.ع';
            return Math.round(p).toLocaleString('en-US') + ' د.ع';
        }
        function now() {
            return new Date().toLocaleString('ku', { hour:'2-digit', minute:'2-digit', hour12:true });
        }
        function toast(msg, isErr = false) {
            const t = document.createElement('div');
            t.className = 'toast' + (isErr ? ' error' : '');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2,4); }

        // ============ STATE ============
        const state = {
            currentPage: 'login',
            currentRole: null,
            currentUser: null,
            managerTab: 'dashboard',
            items: [],
            orders: [],
            partnerOrders: [],
            partnerImages: { talabat:'', zuu:'', wade:'', leezu:'' },
            isLoading: true,
            firebaseError: null,
            unsubscribeItems: null,
            unsubscribeOrders: null,
            unsubscribePartnerOrders: null,
            showItemModal: false,
            editingItemId: null,
            selectedBranch: 'زانکۆ',
            dailyResetTimestamp: null,
            monthlyResetTimestamp: null
        };

        // ============ RESETS ============
        async function performMonthlyReset() {
            const nowD = new Date();
            const bd = getCurrentBusinessDayStart();
            if (state.monthlyResetTimestamp) {
                const lr = new Date(state.monthlyResetTimestamp);
                const lb = getBusinessDayStart(lr);
                if (lb.getMonth() === bd.getMonth() && lb.getFullYear() === bd.getFullYear()) return;
            }
            state.monthlyResetTimestamp = nowD.toISOString();
            try {
                await updateDoc(docRef, { orders: [], monthlyResetTimestamp: state.monthlyResetTimestamp, lastUpdated: new Date().toISOString() });
            } catch(e) { console.error(e); }
            state.orders = [];
        }

        async function checkAndApplyResets() {
            const bd = getCurrentBusinessDayStart();
            if (state.monthlyResetTimestamp) {
                const lb = getBusinessDayStart(new Date(state.monthlyResetTimestamp));
                if (lb.getMonth() !== bd.getMonth() || lb.getFullYear() !== bd.getFullYear()) {
                    await performMonthlyReset();
                }
            }
        }

        async function loadResetTimestamps() {
            try {
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.monthlyResetTimestamp) state.monthlyResetTimestamp = data.monthlyResetTimestamp;
                    await checkAndApplyResets();
                }
            } catch(e) { console.error(e); }
        }

        // ============ FIRESTORE ============
        function loadItemsFromFirestore() {
            if (state.unsubscribeItems) state.unsubscribeItems();
            try {
                state.unsubscribeItems = onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        state.items = (data.items || []).map(item => ({
                            id: item.id || genId(),
                            name: item.naw || 'بێ ناو',
                            price: item.nrx || 0,
                            group: item.grwp || 'گشتی',
                            image: item.link || '',
                            branch: item.branch || 'زانکۆ',
                            partnerPrices: {
                                talabat: item.nt ?? null,
                                zuu: item.nz ?? null,
                                wade: item.nw ?? null,
                                leezu: item.nl ?? null
                            }
                        }));
                        if (data.partnerImages) state.partnerImages = data.partnerImages;
                        if (data.monthlyResetTimestamp) state.monthlyResetTimestamp = data.monthlyResetTimestamp;
                        state.isLoading = false;
                        render();
                    } else {
                        createDefaultDocument();
                    }
                }, (err) => {
                    state.firebaseError = err.message;
                    state.isLoading = false;
                    render();
                });
            } catch(e) { console.error(e); state.isLoading = false; render(); }
        }

        async function createDefaultDocument() {
            try {
                const defaults = [
                    { id:'p1', naw:'پیتزا مەرگ', nrx:12000, grwp:'پیتزا', link:'', branch:'زانکۆ', nt:14000, nz:13000, nw:12500, nl:13500 },
                    { id:'p2', naw:'پیتزا مەک', nrx:10000, grwp:'پیتزا', link:'', branch:'زانکۆ', nt:12000, nz:11000, nw:10500, nl:11500 },
                    { id:'g1', naw:'شاورما گەس', nrx:8000, grwp:'مریشک', link:'', branch:'زانکۆ', nt:10000, nz:9000, nw:8500, nl:9500 },
                    { id:'d1', naw:'پەپسی', nrx:2000, grwp:'خواردنەوەکان', link:'', branch:'زانکۆ', nt:3000, nz:2500, nw:2000, nl:2500 }
                ];
                await setDoc(docRef, {
                    items: defaults,
                    partnerImages: { talabat:'', zuu:'', wade:'', leezu:'' },
                    orders: [],
                    lastUpdated: new Date().toISOString(),
                    monthlyResetTimestamp: new Date().toISOString()
                });
                loadItemsFromFirestore();
            } catch(e) { console.error(e); }
        }

        async function saveItemsToFirestore() {
            try {
                const itemsData = state.items.map(item => ({
                    id: item.id, naw: item.name, nrx: item.price, grwp: item.group,
                    link: item.image || '', branch: item.branch || 'زانکۆ',
                    nt: item.partnerPrices?.talabat ?? null,
                    nz: item.partnerPrices?.zuu ?? null,
                    nw: item.partnerPrices?.wade ?? null,
                    nl: item.partnerPrices?.leezu ?? null
                }));
                await updateDoc(docRef, { items: itemsData, lastUpdated: new Date().toISOString() });
                toast('✅ سەیڤ کرا');
            } catch(e) { toast('هەڵە لە سەیڤکردن', true); }
        }

        function loadOrdersFromFirestore() {
            if (state.unsubscribeOrders) state.unsubscribeOrders();
            state.unsubscribeOrders = onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    state.orders = data.orders || [];
                    if (data.monthlyResetTimestamp) state.monthlyResetTimestamp = data.monthlyResetTimestamp;
                    checkAndApplyResets();
                    render();
                }
            });
        }

        function loadPartnerOrdersFromFirestore() {
            if (state.unsubscribePartnerOrders) state.unsubscribePartnerOrders();
            state.unsubscribePartnerOrders = onSnapshot(collection(db, PARTNER_ORDERS_COLLECTION), (snap) => {
                const arr = [];
                snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                state.partnerOrders = arr;
                render();
            });
        }

        // ============ RENDER ============
        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            if (state.isLoading) {
                app.innerHTML = `<div class="loading-overlay"><div class="spinner"></div><div>⏳ چاوەڕێ بکە...</div></div>`;
                return;
            }
            if (state.firebaseError && state.items.length === 0) {
                app.innerHTML = `<div class="error-container"><h2>⚠️ هەڵە</h2><p>${state.firebaseError}</p><button class="btn" onclick="location.reload()">🔄 هەوڵدانەوە</button></div>`;
                return;
            }

            let html = '';
            if (state.currentPage === 'login') html = renderLogin();
            else if (state.currentPage === 'manager') html = renderManager();

            app.innerHTML = html;

            if (state.showItemModal) app.innerHTML += renderItemModal();
            attachEvents();
        }

        function renderLogin() {
            return `
                <div class="login-page">
                    <div class="login-box">
                        <div class="logo-text">👨‍💼 <span>بەڕێوەبەر</span></div>
                        <p class="subtitle">چێشتخانەی ئایس پۆپ</p>
                        <h2>چوونە ژوورەوە</h2>
                        <input type="text" id="username" placeholder="ناوی بەکارهێنەر" />
                        <input type="password" id="password" placeholder="تێپەڕەوشە" />
                        <button class="btn" data-action="login-manager">چوونە ژوور</button>
                    </div>
                </div>
            `;
        }

        function renderManager() {
            return renderManagerFull();
        }

        function renderManagerFull() {
            let filteredItems = state.items.filter(i => i.branch === state.selectedBranch);
            const itemsHtml = filteredItems.map(item => `
                <tr>
                    <td>${item.image ? `<img src="${item.image}" style="width:36px;height:36px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-left:4px;" onerror="this.style.display='none';"/>` : '🍽️'} ${item.name} <span class="branch-tag zanco">${item.branch}</span></td>
                    <td>${formatPrice(item.price)}</td>
                    <td>${item.partnerPrices ? Object.entries(item.partnerPrices).filter(([k,v])=>v!=null).map(([k,v])=>`${k}: ${formatPrice(v)}`).join('<br/>') : '-'}</td>
                    <td>${item.group || 'گشتی'}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" data-action="edit-item" data-id="${item.id}">✏️</button>
                        <button class="btn btn-sm btn-danger" data-action="delete-item" data-id="${item.id}">🗑️</button>
                    </td>
                </tr>`).join('');

            const todayOrders = state.orders.filter(o => isSameBusinessDay(o.timestamp, Date.now()) && (o.orderType==='dine'||o.orderType==='takeaway'));
            const totalRev = todayOrders.reduce((s,o)=>s+(o.total||0),0);
            const morning = todayOrders.filter(o=>o.shift==='morning');
            const night = todayOrders.filter(o=>o.shift==='night');
            const morningRev = morning.reduce((s,o)=>s+(o.total||0),0);
            const nightRev = night.reduce((s,o)=>s+(o.total||0),0);

            const cashierStats = {};
            todayOrders.forEach(o => { if (o.cashier) cashierStats[o.cashier] = (cashierStats[o.cashier]||0)+1; });
            const cashierStatsHtml = Object.entries(cashierStats).length ?
                Object.entries(cashierStats).map(([n,c])=>`<div class="stat-card"><div class="number">${c}</div><div class="label">${n}</div></div>`).join('')
                : '<p style="grid-column:1/-1;color:#94a3b8;text-align:center;padding:12px;">هیچ داتایەک نییە</p>';

            return `
                <div>
                    <div class="header-bar">
                        <div class="title">👨‍💼 بەڕێوەبەر <span class="live-indicator"></span></div>
                        <div class="user-info">${state.currentUser || 'بەڕێوەبەر'} · ${now()}</div>
                        <button class="back-btn" data-action="logout">🚪 دەرچوون</button>
                    </div>

                    <div class="manager-menu">
                        <button class="${state.managerTab==='dashboard'?'active':''}" data-action="manager-tab" data-tab="dashboard">📊<span>داشبۆرد</span></button>
                        <button class="${state.managerTab==='items'?'active':''}" data-action="manager-tab" data-tab="items">🛒<span>ئایتمەکان</span></button>
                        <button class="${state.managerTab==='partner-detail'?'active':''}" data-action="manager-tab" data-tab="partner-detail">🤝<span>شەریکە</span></button>
                        <button class="${state.managerTab==='monthly-trend'?'active':''}" data-action="manager-tab" data-tab="monthly-trend">📈<span>مانگانە</span></button>
                    </div>

                    ${state.managerTab==='dashboard' ? `
                        <div class="dashboard">
                            <div class="section-title">داهاتی ئەمڕۆ <span class="live-indicator"></span></div>
                            <div class="stats-grid">
                                <div class="stat-card accent"><div class="number">${formatPrice(totalRev)}</div><div class="label">کۆی داهاتی ئەمڕۆ</div></div>
                                <div class="stat-card"><div class="number">${formatPrice(morningRev)}</div><div class="label">شەفتی بەیانی</div></div>
                                <div class="stat-card"><div class="number">${formatPrice(nightRev)}</div><div class="label">شەفتی شەو</div></div>
                            </div>

                            <div class="section-title">ئاماری ئۆردەر</div>
                            <div class="stats-grid">
                                <div class="stat-card green"><div class="number">${todayOrders.length}</div><div class="label">کۆی ئۆردەر</div></div>
                                <div class="stat-card"><div class="number">${morning.length}</div><div class="label">بەیانی</div></div>
                                <div class="stat-card"><div class="number">${night.length}</div><div class="label">شەو</div></div>
                            </div>

                            <div class="section-title">کاشێرەکان</div>
                            <div class="stats-grid">${cashierStatsHtml}</div>

                            <div class="section-title">📋 کۆی ئۆردەرەکان</div>
                            <div class="order-scroll">
                                ${todayOrders.length ? todayOrders.map((o,i)=>`
                                    <div class="order-item" style="border-right-color:${o.orderType==='dine'?'#3498db':'#f39c12'};">
                                        <span class="order-index">${i+1}</span>
                                        <span class="order-type-badge ${o.orderType}">${o.orderType==='dine'?'🍽️ ساڵە':'🛍️ سەفەری'}</span>
                                        <span class="order-text">${o.items.map(it=>`${it.name} ×${it.qty}`).join('، ')}</span>
                                        <span class="order-total">${formatPrice(o.total)}</span>
                                        ${o.discount>0?`<span style="font-size:10px;color:#e17055;white-space:nowrap;font-weight:700;">🔖 ${o.discount}%</span>`:''}
                                        <span class="order-meta">${o.time}</span>
                                        <span class="order-meta">${o.cashier||''}</span>
                                    </div>`).join('') : '<p style="color:#94a3b8;text-align:center;padding:16px;">هیچ ئۆردەرێک نییە</p>'}
                            </div>
                        </div>` : ''}

                    ${state.managerTab==='items' ? `
                        <div class="dashboard">
                            <div class="section-title">🛒 بەڕێوەبردنی ئایتمەکان</div>
                            <button class="btn btn-primary" data-action="show-add-item" style="width:auto;display:inline-flex;padding:10px 20px;font-size:14px;margin-top:4px;">➕ زیاد کردنی ئایتم</button>
                            <div class="table-wrap">
                                <table>
                                    <thead><tr><th>ناو / لق</th><th>نرخ</th><th>نرخی شەریکە</th><th>گرووپ</th><th>کردار</th></tr></thead>
                                    <tbody>${itemsHtml || '<tr><td colspan="5" style="color:#94a3b8;text-align:center;padding:20px;">هیچ ئایتمێک نییە</td></tr>'}</tbody>
                                </table>
                            </div>
                        </div>` : ''}

                    ${state.managerTab==='partner-detail' ? renderPartnerDetail() : ''}
                    ${state.managerTab==='monthly-trend' ? renderMonthlyTrend() : ''}
                </div>
            `;
        }

        function renderPartnerDetail() {
            const partnerOrders = state.partnerOrders.filter(o => isSameBusinessDay(o.timestamp, Date.now()));
            return `
                <div class="dashboard">
                    <div class="section-title">🤝 دیتەیڵی شەریکەکان <span class="live-indicator"></span></div>
                    <div class="partner-detail-grid">
                        ${['talabat','zuu','wade','leezu'].map(p => {
                            const orders = partnerOrders.filter(o=>o.partner===p);
                            const total = orders.reduce((s,o)=>s+(o.total||0),0);
                            const logo = `https://i.ibb.co/${p==='talabat'?'gMT6mBmc':p==='zuu'?'gMT6mBmc':p==='wade'?'gMT6mBmc':'gMT6mBmc'}/unnamed.webp`;
                            return `
                                <div class="partner-detail-card" data-partner="${p}">
                                    <div class="partner-detail-header">
                                        <img src="${logo}" class="partner-detail-logo" onerror="this.style.display='none';"/>
                                        <span class="partner-detail-name">${p.toUpperCase()}</span>
                                    </div>
                                    <div class="partner-detail-stats">
                                        <div class="partner-stat"><span class="partner-stat-number">${orders.length}</span><span class="partner-stat-label">کۆی ئۆردەر</span></div>
                                        <div class="partner-stat"><span class="partner-stat-number">${formatPrice(total)}</span><span class="partner-stat-label">کۆی داهات</span></div>
                                    </div>
                                    <div class="partner-detail-orders">
                                        ${orders.length ? orders.map(o=>`
                                            <div class="partner-order-item">
                                                <span class="partner-order-id">#${o.id||'N/A'}</span>
                                                <span class="partner-order-items">${o.items?o.items.map(i=>`${i.name} ×${i.qty}`).join('، '):''}</span>
                                                ${o.partnerCode?`<span class="partner-order-code">📦 ${o.partnerCode}</span>`:''}
                                                <span class="partner-order-total">${formatPrice(o.total||0)}</span>
                                                <span class="partner-order-time">${o.time||''}</span>
                                            </div>`).join('') : '<p class="no-orders">هیچ ئۆردەرێک نییە</p>'}
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        function renderMonthlyTrend() {
            const monthDays = getMonthDays();
            const monthStart = getMonthStart(new Date());
            const monthEnd = getMonthEnd(new Date());
            const monthName = getMonthNameKurdish(new Date());
            const year = new Date().getFullYear();
            const totalDays = monthDays.length;

            const monthlyFiltered = state.orders.filter(o => !(o.partner && o.orderType==='partner') && (o.orderType==='dine'||o.orderType==='takeaway'));

            const dayData = monthDays.map(day => {
                const dayOrders = monthlyFiltered.filter(o => getBusinessDayStart(o.timestamp).getTime() === getBusinessDayStart(day).getTime());
                return { day, total: dayOrders.reduce((s,o)=>s+(o.total||0),0), count: dayOrders.length };
            });

            const maxTotal = Math.max(...dayData.map(d=>d.total), 1);
            const monthlyTotal = dayData.reduce((s,d)=>s+d.total, 0);
            const avgDaily = totalDays > 0 ? Math.round(monthlyTotal/totalDays) : 0;
            const totalOrders = dayData.reduce((s,d)=>s+d.count, 0);
            const todayStr = new Date().toDateString();

            const cards = dayData.map(d => {
                const isToday = d.day.toDateString() === todayStr;
                const hasData = d.total > 0;
                const isMax = d.total > 0 && d.total === maxTotal;
                const bar = Math.max((d.total/maxTotal)*100, 0);
                let cls = 'day-card' + (isToday?' today':'') + (hasData?' has-data':' empty');
                return `
                    <div class="${cls}">
                        ${isMax?'<span class="day-badge max">⭐ بەرزترین</span>':(isToday?'<span class="day-badge">ئەمڕۆ</span>':'')}
                        <div class="day-header"><span class="day-num">${d.day.getDate()}</span><span class="day-name">${getDayName(d.day)}</span></div>
                        <div class="day-amount">${hasData?formatPrice(d.total):'0 د.ع'}</div>
                        <div class="day-orders-count"><span class="dot" style="background:${hasData?'#00b894':'#cbd5e1'}"></span>${d.count} ئۆردەر</div>
                        <div class="day-bar"><div class="day-bar-fill" style="width:${bar}%"></div></div>
                    </div>`;
            }).join('');

            return `
                <div class="monthly-trend-page">
                    <div class="monthly-trend-header">
                        <h3>📈 ڕەوتی مانگانە <span class="live-indicator"></span></h3>
                        <div class="monthly-trend-summary">
                            <div class="summary-box"><span class="val">${formatPrice(monthlyTotal)}</span><span class="lbl">کۆی مانگ</span></div>
                            <div class="summary-box alt"><span class="val">${formatPrice(avgDaily)}</span><span class="lbl">تێکڕای ڕۆژانە</span></div>
                            <div class="summary-box alt2"><span class="val">${totalOrders}</span><span class="lbl">کۆی ئۆردەر</span></div>
                        </div>
                    </div>
                    <div class="month-info-bar">
                        <span class="month-name">📅 ${monthName} ${year}</span>
                        <span class="month-dates">${formatDateKurdish(monthStart)} → ${formatDateKurdish(monthEnd)}</span>
                        <span class="month-days-count">${totalDays} ڕۆژ</span>
                    </div>
                    <div class="day-cards-grid">${cards}</div>
                </div>`;
        }

        function renderItemModal() {
            const isEdit = !!state.editingItemId;
            const item = isEdit ? state.items.find(i=>i.id===state.editingItemId) : null;
            return `
                <div class="modal-overlay" id="item-modal-overlay">
                    <div class="modal">
                        <button class="close-btn" id="close-item-modal">✕</button>
                        <h3>${isEdit?'✏️ نوێ کردنەوە':'➕ زیاد کردن'}</h3>
                        <div class="form-group"><label>ناو</label><input type="text" id="item-name" value="${item?item.name:''}"/></div>
                        <div class="form-group"><label>نرخ</label><input type="number" id="item-price" value="${item?item.price:''}" step="100"/></div>
                        <div class="form-group"><label>گرووپ</label>
                            <select id="item-group">
                                <option value="">-- هەڵبژێرە --</option>
                                ${GROUP_OPTIONS.map(g=>`<option value="${g}" ${item&&item.group===g?'selected':''}>${g}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group"><label>لینکی وێنە</label><input type="text" id="item-image" value="${item?item.image||'':''}"/></div>
                        <hr style="margin:14px 0;border:none;border-top:1.5px dashed #e2e8f0;"/>
                        <h4 style="margin-bottom:10px;font-size:14px;font-weight:800;">نرخی شەریکەکان</h4>
                        ${['talabat','zuu','wade','leezu'].map(p=>`
                            <div class="form-group"><label>${p.toUpperCase()}</label>
                                <input type="number" id="partner-price-${p}" value="${item&&item.partnerPrices&&item.partnerPrices[p]!=null?item.partnerPrices[p]:''}" step="100"/>
                            </div>`).join('')}
                        <div class="flex" style="margin-top:14px;gap:8px;">
                            <button class="btn" id="save-item-btn" style="flex:1;margin:0;">${isEdit?'💾 نوێکردنەوە':'➕ زیادکردن'}</button>
                            <button class="btn btn-danger" id="cancel-item-btn" style="flex:1;margin:0;">🚫 ڕەتکردنەوە</button>
                        </div>
                    </div>
                </div>`;
        }

        // ============ EVENTS ============
        function attachEvents() {
            document.querySelectorAll('[data-action="login-manager"]').forEach(el => {
                el.onclick = () => {
                    const u = document.getElementById('username')?.value.trim();
                    const p = document.getElementById('password')?.value.trim();
                    if (u === 's4ng4r' && p === 's2026s') {
                        state.currentUser = u;
                        state.currentRole = 'manager';
                        state.currentPage = 'manager';
                        state.managerTab = 'dashboard';
                        toast('بەخێربێیت بەڕێوەبەر');
                        render();
                    } else toast('ناو یان تێپەڕەوشە هەڵەیە', true);
                };
            });

            document.querySelectorAll('[data-action="logout"]').forEach(el => {
                el.onclick = () => {
                    state.currentPage = 'login';
                    state.currentUser = null;
                    state.currentRole = null;
                    state.showItemModal = false;
                    state.editingItemId = null;
                    render();
                };
            });

            document.querySelectorAll('[data-action="manager-tab"]').forEach(el => {
                el.onclick = () => { state.managerTab = el.dataset.tab; render(); };
            });

            document.querySelectorAll('[data-action="show-add-item"]').forEach(el => {
                el.onclick = () => { state.showItemModal = true; state.editingItemId = null; render(); };
            });

            document.querySelectorAll('[data-action="edit-item"]').forEach(el => {
                el.onclick = () => { state.editingItemId = el.dataset.id; state.showItemModal = true; render(); };
            });

            document.querySelectorAll('[data-action="delete-item"]').forEach(el => {
                el.onclick = async () => {
                    if (confirm('دڵنیای؟')) {
                        state.items = state.items.filter(i => i.id !== el.dataset.id);
                        await saveItemsToFirestore();
                        render();
                    }
                };
            });

            const closeBtn = document.getElementById('close-item-modal');
            if (closeBtn) closeBtn.onclick = () => { state.showItemModal=false; state.editingItemId=null; render(); };
            const cancelBtn = document.getElementById('cancel-item-btn');
            if (cancelBtn) cancelBtn.onclick = () => { state.showItemModal=false; state.editingItemId=null; render(); };
            const overlay = document.getElementById('item-modal-overlay');
            if (overlay) overlay.onclick = (e) => { if (e.target===overlay) { state.showItemModal=false; state.editingItemId=null; render(); } };

            const saveBtn = document.getElementById('save-item-btn');
            if (saveBtn) saveBtn.onclick = async () => {
                const name = document.getElementById('item-name')?.value.trim();
                const price = parseFloat(document.getElementById('item-price')?.value);
                const group = document.getElementById('item-group')?.value.trim();
                const image = document.getElementById('item-image')?.value.trim();
                if (!name) return toast('ناو داخل بکە', true);
                if (isNaN(price) || price <= 0) return toast('نرخی دروست داخل بکە', true);
                const pp = {};
                ['talabat','zuu','wade','leezu'].forEach(p => {
                    const v = document.getElementById(`partner-price-${p}`)?.value;
                    pp[p] = v && !isNaN(parseFloat(v)) ? parseFloat(v) : null;
                });
                if (state.editingItemId) {
                    const it = state.items.find(i=>i.id===state.editingItemId);
                    if (it) { it.name=name; it.price=price; it.group=group||'گشتی'; it.image=image||''; it.partnerPrices=pp; }
                } else {
                    state.items.push({ id: genId(), name, price, group: group||'گشتی', branch:'زانکۆ', image: image||'', partnerPrices: pp });
                }
                await saveItemsToFirestore();
                state.showItemModal = false; state.editingItemId = null;
                render();
            };

            document.querySelectorAll('.partner-detail-card').forEach(el => {
                el.onclick = () => { el.classList.toggle('expanded'); el.scrollIntoView({behavior:'smooth',block:'center'}); };
            });
        }

        // ============ INIT ============
        async function init() {
            state.isLoading = true;
            render();
            try {
                try { await signInAnonymously(auth); } catch(e) {}
                await loadResetTimestamps();
                loadItemsFromFirestore();
                loadOrdersFromFirestore();
                loadPartnerOrdersFromFirestore();
                setInterval(() => checkAndApplyResets(), 60000);
            } catch(e) {
                state.firebaseError = e.message;
                state.isLoading = false;
                render();
            }
        }

        init();
    </script>
</body>
</html>
